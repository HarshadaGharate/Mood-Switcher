<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-Switching</title>
    <style>
        .heading{
            text-align: center;
        }
        .container{
            width: 400px;
            background-color: antiquewhite;
            border: 1px solid black;
            display: block;
            margin: 10px auto;
            padding: 20px;
        }
        .mood-happy{
            height: 250px;
            display: block;
            margin: 20px auto;
        }
        .btn-group{
            display: flex;
            justify-content: space-around;
        }
        .btn{
            font-size: 20px;
            padding: 3px 20px;
            border-radius: 20px;
            border: none;
        }
        .btn-happy{
            background-color: #FFD700;
        }
        .btn-sad{
            background-color: #89CFF0;
        }
        .btn-angry{
            background-color: #FF4C4C;
        }

    </style>
</head>
<body>
    <h1 class="heading">Mood Swicher</h1>
    <div class="container">
        <img src="happy.png" alt="happy mood" id="happy" class="mood-happy">
        <div class="btn-group">
        <button type="button" class="btn btn-happy">Happy</button>
        <button type="button" class="btn btn-sad">Sad</button>
        <button type="button" class="btn btn-angry">Angry</button>
        </div>
    </div>
</body>
</html>
