<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-Switching</title>
    <style>
        .heading{
            text-align: center;
            margin-top: 50px;
            color: brown;
        }
        .container{
            width: 300px;
            background-color: rgb(207, 194, 194);
            border: 1px solid black;
            border-radius: 10px;
            display: block;
            margin: 40px auto;
            padding: 30px;
        }
        .mood-happy{
            height: 200px;
            display: block;
            margin: 20px auto;
        }
        .btn-group{
            display: flex;
            justify-content: space-around;
        }
        .btn{
            font-size: 20px;
            padding: 5px 20px;
            border-radius: 20px;
            border: none;
            margin-top: 20px;
        }
        .btn-happy{
            background-color: #FFD700;
        }
        .btn-sad{
            background-color: #89CFF0;
        }
        .btn-angry{
            background-color: #FF4C4C;
        }

    </style>
</head>
<body>
    <h1 class="heading">Mood Swicher</h1>
    <div class="container">
        <img src="happy.png" alt="happy mood" id="emojie" class="mood-happy">
        <div class="btn-group">
        <button type="button" class="btn btn-happy" onclick="happy()">Happy</button>
        <button type="button" class="btn btn-sad" onclick="sad()">Sad</button>
        <button type="button" class="btn btn-angry" onclick="angry()">Angry</button>
        </div>
    </div>

    <script>
        const emojieElement=document.getElementById("emojie");
        function happy(){
            emojieElement.src="happy.png";
        }

        function sad(){
            emojieElement.src="sad.png";
        }

        function angry(){
            emojieElement.src="angry.png";
        }
    </script>
</body>
</html>
